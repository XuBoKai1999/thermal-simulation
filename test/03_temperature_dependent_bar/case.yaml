model:
  type: steady_conduction

materials:
  bar_material:
    k:
      type: table
      file: k.csv
      x: T_K
      y: k_W_mK

regions:
  bar:
    material: bar_material

boundary_conditions:
  hot_end:
    type: fixed_temperature
    value_K: 4.0
  cold_end:
    type: fixed_temperature
    value_K: 1.0
