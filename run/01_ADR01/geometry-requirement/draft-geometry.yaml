# ADR01 rough geometry for the first Codex 3D interpretation.
# Units: mm
# WARNING: placeholder dimensions, not measured hardware dimensions.

meta:
  status: draft-placeholder
  units: mm
  coordinate_system: right-handed-cartesian
  nominal_total_height: 100.0
  nominal_disk_diameter: 25.4
  source_scale_warning: >
    The schematic is not treated as a scale drawing. Dimensions below preserve topology and
    approximate visual proportions while fitting the known ~25.4 mm disk / ~100 mm height envelope.

assembly_constraints:
  - id: adr_chain_coaxial
    components: [cylinder_1, heat_switch, cylinder_2, ggg, cylinder_3]
    rule: >
      These five components form one coaxial ADR chain. Their center_xy positions must remain
      identical and any lateral relocation must move all five together.
    placeholder_center_xy: [-5.0, 0.0]

components:

  - id: hot_plate
    shape: cylinder
    geometry:
      center_xy: [0.0, 0.0]
      z_min: 96.0
      z_max: 100.0
      diameter: 25.4
    thermal_role_hint: fixed_4K_reservoir
    confidence: placeholder

  - id: cylinder_1
    shape: cylinder
    geometry:
      center_xy: [-5.0, 0.0]
      z_min: 64.5
      z_max: 96.0
      diameter: 5.0
    thermal_role_hint: central_thermal_path
    confidence: placeholder

  - id: heat_switch
    shape: cylinder
    geometry:
      center_xy: [-5.0, 0.0]
      z_min: 64.0
      z_max: 64.5
      diameter: 6.0
    thermal_role_hint: thin_placeholder_for_switchable_conductance
    confidence: placeholder
    notes:
      - Keep visually thin in the first geometry.
      - Thermal model may later be converted to Gon/Goff instead of bulk material conduction.

  - id: cylinder_2
    shape: cylinder
    geometry:
      center_xy: [-5.0, 0.0]
      z_min: 54.0
      z_max: 64.0
      diameter: 5.0
    thermal_role_hint: central_thermal_path
    confidence: placeholder

  - id: ggg
    shape: cylinder
    geometry:
      center_xy: [-5.0, 0.0]
      z_min: 34.0
      z_max: 54.0
      diameter: 9.0
    thermal_role_hint: magnetic_refrigerant
    confidence: placeholder

  - id: cylinder_3
    shape: cylinder
    geometry:
      center_xy: [-5.0, 0.0]
      z_min: 4.0
      z_max: 34.0
      diameter: 5.0
    thermal_role_hint: thermal_bus
    confidence: placeholder

  - id: cold_stage
    shape: cylinder
    geometry:
      center_xy: [0.0, 0.0]
      z_min: 0.0
      z_max: 4.0
      diameter: 25.4
    thermal_role_hint: cold_stage
    confidence: placeholder
    notes:
      - The 25.4 mm diameter is used as the current nominal one-inch disk reference.
      - Confirm later which physical disk the one-inch statement refers to.

  - id: sample
    shape: box
    geometry:
      x_min: 2.0
      x_max: 8.0
      y_min: -3.0
      y_max: 3.0
      z_min: 4.0
      z_max: 10.0
    thermal_role_hint: dummy_sample
    confidence: placeholder
    notes:
      - Placed opposite the laterally offset ADR chain so both share the cold-stage area.

  - id: support_1
    shape: cylinder
    geometry:
      center_xy: [0.0, -9.0]
      z_min: 4.0
      z_max: 96.0
      diameter: 2.5
    thermal_role_hint: low_k_parasitic_support
    confidence: placeholder

  - id: support_2
    shape: cylinder
    geometry:
      center_xy: [0.0, 9.0]
      z_min: 4.0
      z_max: 96.0
      diameter: 2.5
    thermal_role_hint: low_k_parasitic_support
    confidence: placeholder
